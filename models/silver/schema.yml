version: 2

models:


  - name: silver_customer
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique



  - name: silver_product
    columns:
      - name: product_id
        tests:
          - not_null
          - unique



  - name: silver_store
    columns:
      - name: store_id
        tests:
          - not_null
          - unique




  - name: silver_supplier
    columns:
      - name: supplier_id
        tests:
          - not_null
          - unique

    



  - name: silver_marketing_campaign
    columns:
      - name: campaign_id
        tests:
          - not_null
          - unique




  - name: silver_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

  


  - name: silver_order_items
    columns:
      - name: order_id
        tests:
          - not_null

      - name: order_item_number
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null



  - name: silver_inventory
    description: >
      Daily product-level inventory position derived from
      consecutive product snapshots and completed orders.

    columns:
      - name: product_id
        tests:
          - not_null

      - name: snapshot_date
        tests:
          - not_null